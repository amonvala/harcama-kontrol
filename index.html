<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ortak Kasa v2.5.0 — Serdar & Esra Aile Bütçesi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons (Sabit UMD Sürümü + Otomatik Yedek CDN - Google Sites & GitHub Pages Uyumlu) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" crossorigin="anonymous" onerror="this.onerror=null;this.src='https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js';"></script>
  <!-- Chart.js (Sabit UMD Sürümü + Otomatik Yedek CDN - Google Sites & GitHub Pages Uyumlu) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';"></script>
  <!-- Mozilla PDF.js (Tarayıcı içi PDF Metin Çıkarıcı) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Google Sites & İframe Tam Uyumluluk Stilleri */
    html, body {
      min-height: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
    }
    .app-shell {
      min-height: 860px;
      height: 100vh;
    }
    /* Google Sites iframe içinde yüksekliğin çökmesini engeller */
    @media (max-height: 750px) {
      .app-shell {
        height: auto;
        min-height: 920px;
      }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-600 selection:text-white">

  <div class="app-shell flex flex-col lg:flex-row w-full overflow-hidden">

    <!-- SOL MENÜ (Masaüstü Sidebar) -->
    <aside class="hidden lg:flex lg:w-72 lg:flex-col bg-slate-900 text-white shrink-0 border-r border-slate-800 select-none">
      <div class="p-5 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-600/25">
            <i data-lucide="wallet" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <h1 class="font-display font-extrabold text-lg tracking-tight leading-none">Ortak Kasa</h1>
            <p class="text-[11px] text-slate-400 mt-1">Serdar & Esra Aile Bütçesi</p>
          </div>
        </div>
        <button onclick="openVersionCacheModal()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-emerald-400 border border-slate-700 transition" title="Versiyon & Cache Yönetimi">
          <span class="app-version-label">v2.5.0</span>
        </button>
      </div>

      <!-- Aktif Kullanıcı Seçici (Serdar / Esra) -->
      <div class="p-4 border-b border-slate-800 bg-slate-900/60">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2 flex items-center justify-between">
          <span>Aktif Kullanıcı</span>
          <span id="sync-badge" class="inline-flex items-center gap-1 text-[10px] text-emerald-400 font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Hazır
          </span>
        </div>
        <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-800 rounded-xl">
          <button id="user-btn-Serdar" onclick="setActiveUser('Serdar')" class="py-2 px-3 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 bg-emerald-600 text-white shadow">
            <span>👨🏻</span> Serdar
          </button>
          <button id="user-btn-Esra" onclick="setActiveUser('Esra')" class="py-2 px-3 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-300 hover:text-white">
            <span>👩🏻</span> Esra
          </button>
        </div>
      </div>

      <!-- Navigasyon Menüsü -->
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">

          <i data-lucide="pie-chart" class="w-4 h-4"></i> Genel Bakış & Bütçe
        </button>
        <button onclick="switchTab('ekle')" id="nav-desk-ekle" class="w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition">

          <span class="px-1.5 py-0.5 text-[10px] rounded bg-emerald-500/20 text-emerald-300 font-bold">AI OCR</span>
        </button>
        <button onclick="switchTab('hareketler')" id="nav-desk-hareketler" class="w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <span class="flex items-center gap-3"><i data-lucide="list-filter" class="w-4 h-4"></i> Tüm Harcamalar</span>
          <span id="nav-tx-count" class="px-2 py-0.5 text-[10px] rounded-full bg-slate-800 text-slate-300 font-bold">265</span>
        </button>
        <button onclick="switchTab('kartlar')" id="nav-desk-kartlar" class="w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <span class="flex items-center gap-3"><i data-lucide="credit-card" class="w-4 h-4"></i> Kartlar & PDF Ekstre</span>
          <span class="px-1.5 py-0.5 text-[10px] rounded bg-rose-500/20 text-rose-300 font-bold">Radar</span>
        </button>

        <div class="pt-3 mt-3 border-t border-slate-800">
          <button onclick="openPdfInspectorDirectly()" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-extrabold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-600 hover:text-white transition">
            <span class="flex items-center gap-2"><i data-lucide
